<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI Scanner</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-image: url('foto1.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-color: #000000; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: 40px 20px; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .layout-wrapper {
            display: flex;
            flex-direction: row; 
            justify-content: center;
            gap: 0; 
            max-width: 900px;
            width: 100%;
            align-items: stretch;
            transition: gap 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        .layout-wrapper.show-results { gap: 20px; }

        .app-container { 
            background-image: linear-gradient(rgba(30, 30, 30, 0.8), rgba(30, 30, 30, 0.9)), url('kotak.jpg'); 
            background-size: cover;
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            flex: 1; 
            min-width: 320px;
            max-width: 400px;
            padding: 30px 24px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            position: sticky;
            top: 40px; 
            height: fit-content;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .result-container {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            background: #27272a;
            max-width: 0; 
            opacity: 0;
            overflow: hidden;
            flex: 0;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .layout-wrapper.show-results .result-container {
            max-width: 400px; 
            flex: 1; 
            opacity: 1; 
            padding: 40px;
        }

        @media (max-width: 768px) {
            .layout-wrapper { flex-direction: column; align-items: center; }
            .app-container { position: relative; top: 0; max-width: 100%; width: 100%; }
            .result-container { 
                max-width: 100%; width: 100%; 
                max-height: 0; 
                opacity: 0;
                padding: 0;
            }
            .layout-wrapper.show-results .result-container {
                max-height: 300px; 
                opacity: 1;
                padding: 40px 20px;
                margin-top: 20px;
            }
        }
        
        .header { margin-bottom: 24px; text-align: center; }
        .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        .header p { color: #a1a1aa; font-size: 0.85rem; margin-top: 4px; }
        
        .media-area { 
            background: rgba(0, 0, 0, 0.4); border-radius: 16px; min-height: 200px; 
            display: flex; justify-content: center; align-items: center; 
            margin-bottom: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }
        #placeholder { color: #71717a; font-size: 0.85rem; }
        video, img#preview { width: 100%; height: 100%; object-fit: cover; display: none; }

        .input-group { margin-bottom: 16px; }
        .input-control { 
            width: 100%; padding: 12px 16px; border-radius: 12px; 
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff; font-size: 0.95rem; outline: none; cursor: pointer;
        }
        select.input-control option { background: #18181b; color: white; } 

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1rem; background: #ffffff; color: #000000; margin-top: 10px;}
        .btn:hover { background: #e4e4e7; }
        .btn:active { transform: scale(0.98); }

        #resName { font-size: 2.5rem; font-weight: 700; text-transform: capitalize; color: white; text-align: center; line-height: 1.2;}
    </style>
</head>
<body>

    <div class="layout-wrapper" id="mainLayout">
        
        <div class="app-container">
            <div class="header">
                <h1>Vision AI</h1>
                <p>Pengenal Objek Cerdas</p>
            </div>

            <div class="media-area" id="mediaBox">
                <span id="placeholder">Area Pratinjau Gambar</span>
                <video id="video" autoplay playsinline></video>
                <img id="preview" />
            </div>

            <div class="input-group">
                <select class="input-control" id="sourceSelect" onchange="handleSource()">
                    <option value="">Pilih sumber gambar...</option>
                    <option value="file">Galeri Foto</option>
                    <option value="kamera">Buka Kamera</option>
                </select>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadPreview(event)" />
            </div>

            <button class="btn" onclick="analyzeByAI()">Identifikasi Objek</button>
        </div>

        <div class="result-container" id="resultPanel">
            <span id="resName">-</span>
        </div>

    </div>

    <script>
        let stream = null;
        let selectedFile = null;

        function handleSource() {
            const selectElement = document.getElementById('sourceSelect');
            const val = selectElement.value;
            
            if (val === 'file') {
                document.getElementById('fileInput').click(); 
                selectElement.value = ""; 
            }
            else if (val === 'kamera') {
                startKamera();
                selectElement.value = ""; 
            }
        }

        function loadPreview(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                stopKamera(); 
                
                const reader = new FileReader();
                reader.onload = (f) => {
                    document.getElementById('preview').src = f.target.result;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        async function startKamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = stream;
                document.getElementById('video').style.display = 'block';
                document.getElementById('preview').style.display = 'none';
                document.getElementById('placeholder').style.display = 'none';
            } catch (err) { alert("Akses kamera ditolak."); }
        }

        function stopKamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('video').style.display = 'none';
        }

        async function analyzeByAI() {
            let fileToSent = selectedFile;
            
            if (stream) {
                const canvas = document.createElement('canvas');
                const v = document.getElementById('video');
                canvas.width = v.videoWidth; canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg'));
                fileToSent = new File([blob], "ai_shot.jpg", {type:"image/jpeg"});
                
                stopKamera();
                document.getElementById('preview').src = canvas.toDataURL();
                document.getElementById('preview').style.display = 'block';
            }

            if (!fileToSent) return alert("Pilih atau ambil foto terlebih dahulu!");

            showLoading(); 
            
            const form = new FormData(); 
            form.append("image", fileToSent);
            
            try {
                const r = await fetch("http://127.0.0.1:5000/analyze", { method: "POST", body: form });
                const d = await r.json(); 
                
                if (d.error) {
                    alert(d.error);
                    hideLoading(); 
                } else {
                    renderResult(d); 
                }
            } catch (e) { 
                alert("Server gagal merespons. Pastikan app.py sudah dijalankan."); 
                hideLoading();
            }
        }

        function showLoading() {
            document.getElementById('mainLayout').classList.add('show-results');
            document.getElementById('resName').innerHTML = "<span style='font-size: 1.2rem; font-weight: 400; color: #a1a1aa;'>Menganalisis...</span>";
        }

        function hideLoading() {
            document.getElementById('mainLayout').classList.remove('show-results');
        }

        function renderResult(data) {
            // Hanya menampilkan nama prediksi (misal: "Pisang")
            document.getElementById('resName').innerText = data.prediksi;
            
            if(window.innerWidth <= 768) {
                setTimeout(() => {
                    document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 400); 
            }
        }
    </script>
</body>
</html>
